<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="description" content="stupidklad — games, shitposts, archives. other links will be seen soon™...">
<title>stupidklad</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 6 6' shape-rendering='crispEdges'><rect width='6' height='6' fill='%23F0F1F2'/><g fill='%23E3C89A'><rect x='2.5' y='.5' width='1' height='1'/><rect x='1.5' y='1.5' width='3' height='1'/><rect x='1.5' y='2.5' width='1' height='1'/><rect x='3.5' y='2.5' width='1' height='1'/><rect x='2.5' y='3.5' width='1' height='1'/><rect x='.5' y='4.5' width='2' height='1'/><rect x='3.5' y='4.5' width='2' height='1'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pad:clamp(20px,3.1vw,60px);
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html{
    color-scheme:dark;
    scrollbar-width:thin;
    scrollbar-color:#222 #000;
  }
  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-track{ background:#000; }
  ::-webkit-scrollbar-thumb{ background:#1f1f1f; border:2px solid #000; }
  ::-webkit-scrollbar-thumb:hover{ background:#333; }

  ::selection{ background:#fff; color:#000; }

  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:var(--pad);
    background:#000;
    color:#fff;
    font-family:'Roboto','Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    animation:in .45s ease-out;
  }
  @keyframes in{ from{ opacity:0; } }

  h1{
    margin:0 0 clamp(24px,2.8vw,54px);
    font-size:clamp(2.8rem,12vw,15rem);
    font-weight:700;
    letter-spacing:-.035em;
    line-height:.95;
  }

  nav ul{ list-style:none; margin:0; padding:0; }

  .link{
    display:flex;
    align-items:baseline;
    font-size:clamp(1.05rem,2.1vw,2.6rem);
    line-height:1.45;
    color:#fff;
    text-decoration:none;
    padding:.04em 0;
    -webkit-tap-highlight-color:transparent;
  }
  .prompt{
    flex:0 0 auto;
    width:0;
    opacity:0;
    overflow:hidden;
    white-space:pre;
    transition:width .25s ease, opacity .2s ease;
  }
  .link.active .prompt{ width:.92em; opacity:1; }

  .link:focus-visible{
    outline:1px dashed #444;
    outline-offset:6px;
  }

  footer{
    margin-top:auto;
    padding-top:40px;
  }
  footer p{
    margin:0;
    font-size:clamp(.95rem,1.55vw,1.95rem);
    line-height:1.4;
    color:#3a3a3a;
  }

  @media (prefers-reduced-motion: reduce){
    body{ animation:none; }
    .prompt{ transition:none; }
  }
</style>
<noscript>
<style>
  .link:first-child .prompt{ width:.92em; opacity:1; }
</style>
</noscript>
</head>
<body>

<h1>stupidklad</h1>

<nav aria-label="links">
  <ul>
    <li>
      <a class="link" href="https://gamejolt.com/@StupidKlad" target="_blank" rel="noopener noreferrer"><span class="prompt" aria-hidden="true">&gt; </span><span>my gamejolt acc (games, shitposts)</span></a>
    </li>
    <li>
      <a class="link" href="https://lunlibrary.neocities.org" target="_blank" rel="noopener noreferrer"><span class="prompt" aria-hidden="true">&gt; </span><span>lunlibrary (big moonzy x archive)</span></a>
    </li>
    <li>
      <a class="link" href="https://stupidklad.itch.io/clickflow" target="_blank" rel="noopener noreferrer"><span class="prompt" aria-hidden="true">&gt; </span><span>clickflow</span></a>
    </li>
  </ul>
</nav>

<footer>
  <p>other links will be seen soon&#8482;...</p>
</footer>

<script>
(function(){
  'use strict';

  var links = Array.prototype.slice.call(document.querySelectorAll('.link'));
  var active = 0;

  function setActive(i){
    var n = links.length;
    active = ((i % n) + n) % n;
    links.forEach(function(l, j){ l.classList.toggle('active', j === active); });
  }

  var t = setTimeout(function(){ setActive(0); }, 400);
  function touched(){ clearTimeout(t); }

  links.forEach(function(l, i){
    l.addEventListener('pointerenter', function(e){
      if (e.pointerType !== 'mouse') return;
      touched();
      setActive(i);
    });
    l.addEventListener('focus', function(){
      touched();
      setActive(i);
    });
  });

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      touched();
      setActive(active + (e.key === 'ArrowDown' ? 1 : -1));
      links[active].focus();
    } else if (e.key === 'Enter' && document.activeElement === document.body){
      links[active].click();
    }
  });
})();
</script>
</body>
</html>
